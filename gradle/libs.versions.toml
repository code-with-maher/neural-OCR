[versions]
agp = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.6"
compileSdk = "36"
minSdk = "28"
targetSdk = "36"
composeBom = "2026.03.01"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
okhttp = "5.3.2"
navigation = "2.9.7"
datastore = "1.3.0-alpha07"
serialization = "1.7.1"
# تم استخدام الإصدار ما قبل الأخير لمكتبة روم بناءً على طلبك
room = "3.0.0-alpha01" 
work = "2.9.0"
pdfbox = "2.0.27.0"
media3 = "1.6.0"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { module = "androidx.activity:activity-compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# تحديث أسماء وحدات Room لتتوافق مع الإصدار 3.x (تم تغيير المسار إلى room3)
androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room3:room3-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }

androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# -------------------------------------------------------------------------
# Notes for the AI Agent/Model applying this configuration:
# -------------------------------------------------------------------------
# Summary of Documentation Updates (April 2026):
# 
# 1. Room Library (Testing Update Mechanism):
#    - We are intentionally using the N-1 version of Room (`3.0.0-alpha01`) 
#      while the absolute latest is `3.0.0-alpha02`.
#    - CRITICAL: Room 3.0 introduces a massive architectural shift to support KMP. 
#      The package namespace has migrated from `androidx.room` to `androidx.room3`.
#      Ensure you update imports in the source code accordingly.
#    - Reference: https://developer.android.com/jetpack/androidx/releases/room3
#
# 2. Plugins to Add:
#    - You must add and apply `alias(libs.plugins.ksp)` in the build.gradle file.
#      Note that KSP is now completely independent of the Kotlin version.
#    - Reference: https://github.com/google/ksp/releases
#
# 3. Modern Compose BOM:
#    - The BOM has been updated to the latest 2026.03.01 release to pull the 
#      latest underlying Compose dependencies seamlessly.
#    - Reference: https://developer.android.com/develop/ui/compose/bom
# -------------------------------------------------------------------------
