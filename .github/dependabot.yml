version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      all-gradle-updates:
        patterns:
          - "*"
    reviewers:
      - "code-with-maher"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:10"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      all-actions-updates:
        patterns:
          - "*"
    reviewers:
      - "code-with-maher"
