name: Run All Kotlin CLI Help Commands

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "true"

jobs:
  run-all-help:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for kotlin wrapper
        run: |
          if [ -f "./kotlin" ]; then chmod +x ./kotlin; fi

      - name: Run Main Help & All Subcommands Help
        run: |
          if [ ! -f "./kotlin" ]; then
            echo "Executable ./kotlin not found!"
            ls -la
            exit 1
          fi

          echo "=========================================="
          echo "         1. GENERAL HELP COMMAND          "
          echo "=========================================="
          ./kotlin --help

          echo ""
          echo "=========================================="
          echo "       2. SUBCOMMANDS HELP INSPECTION     "
          echo "=========================================="

          # القائمة الكاملة والدقيقة للأوامر والأوامر الفرعية
          COMMANDS=(
            "build"
            "check"
            "clean"
            "clean-shared-caches"
            "compose-hot-reload-mcp-server"
            "do"
            "generate-completion"
            "init"
            "package"
            "publish"
            "run"
            "show"
            "show modules"
            "show settings"
            "show dependencies"
            "show tasks"
            "show checks"
            "show commands"
            "test"
            "tool"
            "update"
          )

          for cmd in "${COMMANDS[@]}"; do
            echo ""
            echo "------------------------------------------"
            echo " >>> HELP FOR: ./kotlin $cmd --help"
            echo "------------------------------------------"
            eval "./kotlin $cmd --help" || echo "Note: Command '$cmd' returned an exit code or error."
          done
