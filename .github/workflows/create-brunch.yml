name: Run Kotlin CLI Help

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  general-help:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for kotlin wrapper
        run: |
          if [ -f "./kotlin" ]; then chmod +x ./kotlin; fi

      - name: Run General Help Command
        run: |
          echo "=========================================="
          echo "       RUNNING KOTLIN HELP COMMAND        "
          echo "=========================================="
          
          if [ -f "./kotlin" ]; then
            ./kotlin --help
          else
            echo "Executable ./kotlin not found! Current directory layout:"
            ls -la
          fi
