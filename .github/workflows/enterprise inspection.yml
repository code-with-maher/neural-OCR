name: Manual Enterprise Inspection
on:
  workflow_dispatch:

jobs:
  inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Clean Project
        run: ./gradlew clean

      - name: Android Lint
        run: ./gradlew lintRelease

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Check
        run: ./gradlew check --continue

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Inspection-Reports
          path: |
            **/build/reports/lint-results-release.html
            **/build/reports/tests/testDebugUnitTest/index.html
