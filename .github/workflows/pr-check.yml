name: "🛡️ Enterprise Quality & Security Guard"

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-scan:
    name: "🔐 Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - uses: actions/dependency-review-action@v4

  static-analysis:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - run: |
          chmod +x ./gradlew
          ./gradlew lintRelease --no-daemon

  unit-tests:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest --no-daemon

  build-verification:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'
      - run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -w
