name: "Modern Label Factory 🚀"

on:
  workflow_dispatch: # تشغيل يدوي بضغطة زر عندما تقرر ذلك

permissions:
  issues: write # تصريح حيوي لكي يتمكن الأكشن من تعديل التصنيفات

jobs:
  label-injection:
    runs-on: ubuntu-latest
    steps:
      # العودة من العصر الحجري إلى المستقبل بطلبك
      - name: 🛰️ Checkout Repository (Cutting Edge)
        uses: actions/checkout@v6

      - name: 🎨 Build & Sync Professional Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # تعريف المصفوفة بالتصنيفات الستة التي طلبتها مع ألوان "مودرن"
          declare -A LABELS=(
            ["android"]="3DDC84"
            ["dependencies"]="0366d6"
            ["gradle"]="02303A"
            ["wrapper"]="E4E669"
            ["ci"]="207de5"
            ["github-actions"]="24292e"
          )

          echo "🚀 Starting the professional workflow for Maher..."
          
          # الحصول على اسم المستودع الحالي تلقائياً
          REPO=${{ github.repository }}

          for label in "${!LABELS[@]}"; do
            echo "Checking label: $label"
            
            # محاولة إنشاء الليبل، وفي حال وجوده نقوم بتحديث لونه فقط لضمان الدقة
            if gh label list --repo "$REPO" | grep -q "^$label[[:space:]]"; then
              echo "🔄 Label '$label' exists, updating color..."
              gh label edit "$label" --color "${LABELS[$label]}" --repo "$REPO"
            else
              echo "✨ Creating new label: '$label'"
              gh label create "$label" --color "${LABELS[$label]}" --repo "$REPO"
            end
          done

          echo "✅ Mission Accomplished. Your repository is now organized!"
