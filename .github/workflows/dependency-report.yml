name: Dependency Update Report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dependency-report.yml'
  schedule:
    - cron: '0 0 */3 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check dependency updates
        run: |
          echo "org.gradle.warning.mode=all" >> gradle.properties
          ./gradlew dependencyUpdates > dependency-report.txt || true

      - name: Generate markdown report
        run: |
          echo "# Dependency Update Report" > DEPENDENCY_REPORT.md
          echo "" >> DEPENDENCY_REPORT.md
          echo "Generated on: $(date)" >> DEPENDENCY_REPORT.md
          echo "" >> DEPENDENCY_REPORT.md
          echo "## Latest dependency state" >> DEPENDENCY_REPORT.md
          echo '```' >> DEPENDENCY_REPORT.md
          cat dependency-report.txt >> DEPENDENCY_REPORT.md
          echo '```' >> DEPENDENCY_REPORT.md

      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add DEPENDENCY_REPORT.md
          git diff --cached --quiet || git commit -m "docs: update dependency report"

      - name: Push changes
        run: |
          git push