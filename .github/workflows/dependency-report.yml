name: Create Labels Manually

on:
  workflow_dispatch:

jobs:
  create-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GH CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN_OVERRIDE }}" | gh auth login --with-token

      - name: Create labels using GitHub CLI
        run: |
          labels=("android" "dependencies" "gradle" "wrapper" "ci" "github-actions")
          for label in "${labels[@]}"; do
            gh label create "$label" --color "0e8a16" --description "Created by workflow" || echo "Label $label already exists"
          done