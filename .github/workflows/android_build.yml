name: Build Android APK and Notify Telegram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      TELEGRAM_TOKEN: 8250432075:AAHpB8weBYy4_3XIhd7mCpC1hgnWI_lFTB4
      TELEGRAM_CHAT_ID: 7915367198

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Grant Gradle Execute Permission
      run: chmod +x ./gradlew

    - name: Build APK
      id: build_apk
      run: |
        set -e
        ./gradlew assembleDebug --stacktrace --console=plain | tee build_log.txt

    - name: Send APK and Log to Telegram if Success
      if: success()
      run: |
        APK_PATH=$(find ./app/build/outputs/apk/debug -name "*.apk" | head -n 1)
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
          -F chat_id="$TELEGRAM_CHAT_ID" \
          -F document="@build_log.txt" \
          -F caption="✅ Build succeeded. APK attached." > /dev/null
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
          -F chat_id="$TELEGRAM_CHAT_ID" \
          -F document=@"$APK_PATH" \
          -F caption="APK File" > /dev/null

    - name: Send Log to Telegram if Failure
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
          -F chat_id="$TELEGRAM_CHAT_ID" \
          -F document="@build_log.txt" \
          -F caption="❌ Build failed. See log attached." > /dev/null