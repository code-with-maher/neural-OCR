name: Maher Build & Notify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1

      - name: Upload APK to Telegram
        if: success()
        env:
          BOT_TOKEN: "8250432075:AAHpB8weBYy4_3XIhd7mCpC1hgnWI_lFTB4"
          CHAT_ID: "7915367198"
        run: |
          curl -v -F document=@app/build/outputs/apk/debug/app-debug.apk \
               -F caption="✅ تم البناء بنجاح يا ماهر! 🚀 النسخة جاهزة للتثبيت." \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument?chat_id=${CHAT_ID}"

      - name: Send Error Log on Failure
        if: failure()
        env:
          BOT_TOKEN: "8250432075:AAHpB8weBYy4_3XIhd7mCpC1hgnWI_lFTB4"
          CHAT_ID: "7915367198"
        run: |
          # استخراج أول 15 سطر من الخطأ لإرسالها
          ERROR_SUMMARY=$(grep -i "error" build_log.txt | head -n 15)
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
               -d "chat_id=${CHAT_ID}" \
               -d "text=❌ فشل البناء يا ماهر! إليك ملخص الأخطاء:
               
               ${ERROR_SUMMARY}"
