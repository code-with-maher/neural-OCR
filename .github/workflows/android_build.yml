name: Maher Build & Notify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK (FULL LIVE LOG)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --console=plain | tee build_log.txt

      - name: Send APK + Log (Success)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          curl -s -F document=@app/build/outputs/apk/debug/app-debug.apk \
               -F document=@build_log.txt \
               -F caption="✅ البناء نجح + السجل الكامل" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument?chat_id=${CHAT_ID}"

      - name: Send Log (Failure)
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          curl -s -F document=@build_log.txt \
               -F caption="❌ فشل البناء - السجل الكامل" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument?chat_id=${CHAT_ID}"