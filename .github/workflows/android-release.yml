name: "🚀 Pro Release Build & Telegram Dispatch"

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build & Upload APK"
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code (v6)
        uses: actions/checkout@v6

      - name: ☕ Setup Java 25 (LTS)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: 🔨 Execute Build (Clean Logs)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain -w

      - name: ✈️ Notify Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # تثبيت مكتبة requests إذا لم تكن موجودة (احتياطاً)
          pip install requests
          # تشغيل السكربت العبقري
          python3 notify_telegram.py
