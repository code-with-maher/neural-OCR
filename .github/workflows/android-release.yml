name: "🚀 Pro Release Build & Telegram Dispatch"

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build & Upload APK"
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code (v6)
        uses: actions/checkout@v6

      - name: ☕ Setup Java 25 (LTS - Most Stable)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: 🔨 Execute Build (Using Local Wrapper)
        id: build_step
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --info

      - name: ✈️ Send APK to Telegram (URL-Query Style)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          curl -v \
            -F "document=@$APK_PATH" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument?chat_id=${CHAT_ID}&caption=✅ تم بناء نسخة ريليز بنجاح يا ماهر!"

      - name: ⚠️ Error Notification (Actions Only)
        if: failure()
        run: |
          echo "::error title=Build Failed::يا ماهر، البناء فشل. راجع سجلات الـ Info أعلاه."
