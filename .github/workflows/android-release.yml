name: "🚀 Pro Release Build & Telegram Dispatch"

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build & Upload APK"
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code (v7)
        uses: actions/checkout@v7

      - name: ☕ Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: ⚡ Setup Gradle Cache (The Pro Way)
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Decode Keystore
        run: echo "${{ secrets.KEY }}" | base64 --decode > release.jks

      - name: 🔨 Execute Build (Turbo Mode)
        run: |
          chmod +x ./gradlew
          # تم الإبقاء على الـ Daemon والـ الكاش المتطور لسرعة المعالجة الداخلية
          ./gradlew assembleRelease --build-cache --configuration-cache --parallel --console=plain -w
        env:
          KEYSTORE_PATH: ../release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          - name: ✈️ Notify Telegram (Python Script Reverted)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # العودة إلى سكريبت البايثون الخاص بك لإرسال آمن ومستقر للـ Secrets
        run: |
          pip install requests
          python3 notify_telegram.py
