name: "🚀 Pro Release Build & Telegram Dispatch (Gradle Action Test)"

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build & Upload APK"
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code
        uses: actions/checkout@v7

      - name: ☕ Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: 🐘 Setup Gradle Official Action
        uses: gradle/actions/setup-gradle@v6

      - name: 🔑 Decode Keystore
        run: echo "${{ secrets.KEY }}" | base64 --decode > release.jks

      - name: 🔨 Execute Build (Turbo Mode)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache --configuration-cache --parallel --console=plain -w
        env:
          KEYSTORE_PATH: ../release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 🧹 Cleanup Keystore
        if: always()
        run: rm -f release.jks

      - name: ✈️ Notify Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          curl -F chat_id="${CHAT_ID}" -F document=@"${APK_PATH}" -F caption="🚀 تم بناء نسخة الـ Release بنجاح يا ماهر!" https://api.telegram.org/bot${BOT_TOKEN}/sendDocument
