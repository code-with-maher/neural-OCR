name: "🚀 Pro Release Build & Telegram Dispatch"

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build & Upload APK"
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Code (v6)
        uses: actions/checkout@v6

      - name: ☕ Setup Java 25 (LTS - Most Stable)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: 🔨 Execute Build (Clean Logs)
        id: build_step
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain -w

      - name: ✈️ Send APK to Telegram (Final Industrial Fix)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPTION: "✅ تم بناء نسخة ريليز بنجاح يا ماهر! خذها قبل أن تبرد."
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK file not found!"
            exit 1
          fi

          # استخدام curl مع تمرير المتغيرات بشكل آمن تماماً عبر الـ Form
          curl -s -v -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${APK_PATH}" \
            -F caption="${CAPTION}"
