name: "FINAL FIX: Write Wrapper to Disk"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  force-write:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v6

      - name: "Setup Java 21"
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: "Force Generate Wrapper in Root"
        run: |
          # تنظيف حقيقي للمجلد الحالي
          rm -rf gradle/ gradlew gradlew.bat
          
          # استخدام أمر النظام مباشرة لضمان الكتابة في المجلد الحالي (.)
          npm install -g gradle
          gradle wrapper --gradle-version 9.4.0 --distribution-type all --gradle-distribution-url https://services.gradle.org/distributions/gradle-9.4.0-all.zip
          
          # التحقق البصري (سيظهر في الـ Logs)
          echo "Checking if files exist in $(pwd):"
          ls -la gradlew
          ls -la gradle/wrapper/gradle-wrapper.jar

      - name: "Commit and Push"
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(infra): [fixed] write gradle 9.4.0 wrapper to root"
          file_pattern: 'gradle/* gradlew gradlew.bat'
          commit_user_name: "Maher Infrastructure Bot"
          commit_user_email: "maher-bot@github.com"
