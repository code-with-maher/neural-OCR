name: "Maher Deep Clean: Purge .gradle & build"

on:
  workflow_dispatch: # تشغيل يدوي فقط

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  total-purge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout Code v6"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Setup Java JDK 21"
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: "CRITICAL: Purge Junk Folders & Upgrade"
        run: |
          # 1. حذف المجلدات المتسللة من تتبع Git (دون حذفها من جهازك)
          git rm -r --cached .gradle/ || echo ".gradle not in git"
          git rm -r --cached build/ || echo "build/ not in git"
          # أحياناً يكون هناك مجلد build داخل مجلد app
          git rm -r --cached app/build/ || echo "app/build/ not in git"
          
          # 2. حذف المجلدات فعلياً من السيرفر المؤقت
          rm -rf .gradle/
          rm -rf build/
          rm -rf app/build/
          
          # 3. تحديث الرابر إلى 9.4.1
          npm install -g gradle
          gradle wrapper --gradle-version 9.4.1 --distribution-type all
          chmod +x gradlew
          
          # 4. تحديث الـ .gitignore لضمان "نظافة" أبدية
          echo -e "\n.gradle/\nbuild/\napp/build/\n*.apk\n*.jks\ncaptures/" >> .gitignore
          # إزالة السطور المكررة من الملف
          sort -u .gitignore -o .gitignore
          
          echo "Purge complete. Repository is now clean and 9.4.1 ready."

      - name: "Commit Clean Infrastructure"
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(infra): [PURGE] remove .gradle and build folders, upgrade 9.4.1"
          file_pattern: 'gradle/* gradlew gradlew.bat .gitignore'
          commit_user_name: "Maher Purge Master"
          commit_user_email: "maher-bot@github.com"
          push_options: '--force'
