plugins {
    id 'com.android.application'
}

android {
    namespace "com.a.labs"
    compileSdk 34

    defaultConfig {
        applicationId "com.a.labs"
        minSdkVersion 24 
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        viewBinding true // أضفت هذا لأن الكود القديم قد يحتاجه
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // مكتبات أندرويد الأساسية
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1' // أضفتها لدعم الكود القديم
    implementation 'com.google.android.material:material:1.11.0'
    
    // --- المكتبة المنقذة (OkHttp) ---
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // مكتبات Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
