plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.1.10' // أحدث إصدار مستقر لـ Kotlin في 2026
}

android {
    namespace "com.a.labs"
    compileSdk 36 // استهداف أندرويد 16

    defaultConfig {
        applicationId "com.a.labs"
        minSdk 28    // أندرويد 9 (Pie) كما طلبت
        targetSdk 36 // أندرويد 16
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // تفعيل ضغط الكود والموارد لرؤية الحجم الحقيقي
            minifyEnabled true
            shrinkResources true
            // "الخداع القانوني": توقيع نسخة الريليز بمفتاح الديباج
            signingConfig signingConfigs.debug 
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        // تحديث لـ Java 21 لتتوافق مع معايير 2026
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    // تحديثات المكتبات لأحدث نسخ مستقرة 2026
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
}
