product: android/app

dependencies:
  - $compose.foundation
  - $compose.material3
  - androidx.compose.material:material-icons-extended:1.7.8
  - androidx.activity:activity-compose:1.13.0
  - androidx.core:core-ktx:1.19.0
  - androidx.core:core-splashscreen:1.2.0
  - androidx.lifecycle:lifecycle-runtime-ktx:2.11.0
  - androidx.navigation:navigation-compose:2.9.8
  - androidx.datastore:datastore-preferences:1.2.1
  - com.squareup.okhttp3:okhttp:5.4.0
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0
  - androidx.room:room-runtime:2.8.4
  - androidx.room:room-ktx:2.8.4
  - androidx.work:work-runtime-ktx:2.11.2
  - com.tom-roush:pdfbox-android:2.0.27.0
  - androidx.media3:media3-exoplayer:1.10.1
  - androidx.media3:media3-session:1.10.1

settings:
  kotlin:
    version: "2.3.20"
    ksp:
      version: "2.3.20"
      processors:
        - androidx.room:room-compiler:2.8.4
      processorOptions:
        room.schemaLocation: ./schemas
    serialization:
      enabled: true
      version: "1.11.0"
  compose:
    enabled: true
  android:
    compileSdk: 37
    targetSdk: 37
    minSdk: 28
    parcelize:
      enabled: true
    signing:
      enabled: true
      propertiesFile: ./keystore.properties
